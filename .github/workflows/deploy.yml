name: Deploy to AWS

# Run this workflow every time code is pushed to the main branch
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Grab a copy of your repo onto the runner machine
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log into AWS using the secrets you stored in GitHub
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Copy the frontend folder into your S3 bucket.
      #    --delete removes any files from S3 that no longer exist locally,
      #    keeping the bucket a clean mirror of your frontend folder.
      - name: Upload frontend to S3
        run: aws s3 sync ./frontend s3://shivam-cloud-resume-2026 --delete

      # 4. Clear CloudFront's cache so visitors get the new files immediately
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1VSSFDVLIHLVK --paths "/*"
